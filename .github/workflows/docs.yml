# The docs site on GitHub Pages. Settings → Pages → Source: GitHub Actions. The site documents the latest release, so
# release.yml calls this once npm has the packages: after each release, and after a push to main with no changeset
# waiting (a fix of the docs alone). A merged feature waits for its release, and so do its pages. By hand (Run
# workflow), it refuses while changesets are waiting.
name: docs
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # pnpm arrives after this step, through corepack
      - name: Nothing waits for a release
        run: |
          if ls .changeset/*.md | grep -qv '/README.md$'; then
            echo "::error::changesets wait for their release: the docs are published with it"
            exit 1
          fi
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter docs build
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
          # the GitHub App the editor signs in with (apps/github-auth/README.md): public values, repository variables;
          # unset, the editor asks for a pasted token instead
          VITE_GITHUB_APP_CLIENT_ID: ${{ vars.LOADMAP_GITHUB_APP_CLIENT_ID }}
          VITE_GITHUB_APP_SLUG: ${{ vars.LOADMAP_GITHUB_APP_SLUG }}
          VITE_GITHUB_APP_EXCHANGE: ${{ vars.LOADMAP_GITHUB_APP_EXCHANGE }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/dist
  deploy:
    needs: build
    # on the job, not the workflow: release.yml calls this one, and one deployment of the pages at a time
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
