# Changesets: on main, a pull request that bumps the versions and writes the changelogs; once it is merged, the
# packages npm does not have yet are published. No npm token: each package trusts this workflow on npmjs.com (trusted
# publishing over OIDC, hence id-token: write), and npm adds the provenance itself.
name: release
on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # pnpm arrives after this step, through corepack
          registry-url: https://registry.npmjs.org
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # v2 is the line that reads Changesets v3's output: v1 published but made no tags or GitHub releases.
      - uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release
