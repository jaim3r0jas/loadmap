# The assistant's eval (apps/eval): every case against the models named, by hand only. A model's answer differs from
# run to run and costs money, so this is never part of check. The keys are the repository's secrets; each provider's
# key reaches only the step that runs, and the table lands in the job's summary and as an artifact.
name: eval
on:
  workflow_dispatch:
    inputs:
      models:
        description: "provider:model, comma-separated (anthropic:claude-haiku-5-5,deepseek:deepseek-flash)"
        required: true
        default: "anthropic:claude-haiku-5-5,deepseek:deepseek-flash"
      forms:
        description: "operations, files, or both"
        required: true
        default: "operations,files"
      cases:
        description: "case ids, comma-separated (empty: every case)"
        required: false
        default: ""

permissions: {}

jobs:
  eval:
    name: eval
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # pnpm arrives after this step, through corepack
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the eval
        env:
          LOADMAP_EVAL_MODELS: ${{ inputs.models }}
          LOADMAP_EVAL_FORMS: ${{ inputs.forms }}
          LOADMAP_EVAL_CASES: ${{ inputs.cases }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pnpm --filter @loadmap/eval eval
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval
          path: apps/eval/out/
          if-no-files-found: ignore
