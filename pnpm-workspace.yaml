packages:
  - packages/*
  - examples/*
  - apps/*

# Supply-chain guards for every install, local and in CI. A version younger than 3 days is not installed (a hijacked
# release is usually found and pulled within that); a version published with weaker trust than an earlier one (lost
# provenance, say) fails the install; a dependency that wants to run an install script fails it instead of being
# silently skipped (allow one in allowBuilds after reading what it runs); no git or tarball dependency deep in the tree.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - mediabunny@1.65.0
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true
allowBuilds:
  # vsce's signing tool: its script copies a platform binary into place (or downloads one). Packaging and publishing
  # the VS Code extension never sign locally (the Marketplace signs), so it stays unbuilt
  "@vscode/vsce-sign": false
overrides:
  # vscode-languageclient (bundled into the VS Code extension) and vsce ask for minimatch 10, which a crafted glob can
  # slow to a halt (fixed in 11.0.1). The extension matches only its own globs; 11 is the same API, and its e2e tests
  # and packaging run on it. Only 10 is lifted: an older major's callers may need its default export
  minimatch@>=10 <11.0.1: 11.0.4
