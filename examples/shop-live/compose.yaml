# A shop with data, in a minute: `docker compose up` here, then Grafana on http://localhost:3000 (no login) and
# Prometheus on http://localhost:9090. The shop is simulator.ts; nothing leaves this machine.
services:
  shop:
    image: node:24-alpine
    command: node /shop/simulator.ts
    volumes:
      - ./simulator.ts:/shop/simulator.ts:ro
    ports:
      - "9464:9464"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9464/metrics"]
      interval: 2s
      retries: 15

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      shop:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 2s
      retries: 30

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      # a demo on your own machine: open without a login, and nothing can be changed by a visitor
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/shop.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 2s
      retries: 30
